/* ===========================================================
   HOOKS
=========================================================== */
function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("show"); });
    }, { threshold: 0.06 });
    const scan = () => document.querySelectorAll(".reveal:not(.show)").forEach(el => io.observe(el));
    scan();
    const mo = new MutationObserver(scan);
    mo.observe(document.body, { childList: true, subtree: true });
    return () => { io.disconnect(); mo.disconnect(); };
  }, []);
}

function useActiveSection(ids) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: "-35% 0px -60% 0px" });
    ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, [ids]);
  return active;
}

{`skills/
  your-skill-name/
    `}<span className="cmd">SKILL.md</span>{`            `}<span className="dim">← required</span>{`

    helper.sh           `}<span className="dim">← only if reusable</span>{`

`}<span className="dim">Keep inline: principles, concepts,
code patterns under 50 lines.</span>
            </Code>
            <Code>
<span className="dim">{`---`}</span>{`
`}<span className="cmd">name</span>{`: condition-based-waiting
`}<span className="cmd">description</span>{`: Use when tests use sleep or

  timing-dependent
`}<span className="dim">---</span>{`

`}<span className="ok"># Condition-Based Waiting</span>{`
## Overview        `}<span className="dim">core principle, 1–2 lines</span>{`
## When to Use     `}<span className="dim">+ when NOT to</span>{`
## Core Pattern    `}<span className="dim">before / after</span>{`
## Quick Reference `}<span className="dim">scannable table</span>{`
## Common Mistakes`}

              { t: "Budget your tokens", d: "Frequently-loaded skills under 200 words total; others under 500. They literally check with wc -w." },
              { t: "Never use @-references", d: "@skills/foo/SKILL.md force-loads the file immediately and can burn 200k of context before you need it. Write \"REQUIRED SUB-SKILL: use superpowers:foo\" instead." },

          </div>

/* ===========================================================

=========================================================== */
const CompareSection = () => {
  const [answers, setAnswers] = useState({});
  const Q = [
    { id: "q1", q: "Where does your pain actually start?", a: [
      { t: "Nobody agrees what we're building", w: "b" },
      { t: "We know what to build, the code comes back sloppy", w: "s" },
    ]},
    { id: "q2", q: "Who is going to use this?", a: [
      { t: "Mixed team — PMs, designers, engineers", w: "b" },
      { t: "Engineers, mostly working solo with an agent", w: "s" },
    ]},
    { id: "q3", q: "What does a typical unit of work look like?", a: [
      { t: "A multi-epic initiative over weeks", w: "b" },
      { t: "A feature or fix over hours to days", w: "s" },
    ]},
    { id: "q4", q: "What would make your lead engineer happiest?", a: [
      { t: "Requirements that don't change three times", w: "b" },
      { t: "Tests that exist and reviews that happen", w: "s" },
    ]},
  ];
  const done = Object.keys(answers).length === Q.length;
  const bCount = Object.values(answers).filter(v => v === "b").length;
  const verdict = bCount >= 3 ? "b" : bCount <= 1 ? "s" : "both";

  return (
    <Section
      id="compare"
      eyebrow="Head to head"
      title="They are not competitors. They are different halves."
      lede="Read the table for the honest differences, then answer four questions to get a starting recommendation."
      wide
    >
      <div className="max-w-5xl">
        <div className="reveal card overflow-hidden mb-12">
          <table className="grid-t">
            <thead>
              <tr>
                <th style={{ width: "18%" }}>Dimension</th>
                <th style={{ width: "41%", color: "var(--amber)" }}>BMAD Method</th>
                <th style={{ width: "41%", color: "var(--sage)" }}>Superpowers</th>
              </tr>
            </thead>
            <tbody>
              {COMPARE.map(r => (
                <tr key={r.dim}><td className="k">{r.dim}</td><td>{r.b}</td><td>{r.s}</td></tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Combining */}
        <div className="mb-12">
          <div className="reveal mb-3"><Eyebrow>The obvious question</Eyebrow></div>
          <h3 className="display-tight text-xl md:text-2xl text-ink mb-4 reveal">Can you run both?</h3>
          <div className="grid md:grid-cols-2 gap-5">
            <div className="card p-5 reveal">
              <div className="chip chip-sage mb-3">Yes, technically</div>
              <p className="text-[13px] text-ink-2 leading-relaxed">
                They are separate installs writing to separate folders. Nothing collides on disk. The natural split is <strong className="text-ink">BMAD for phases 1–3</strong> (brief → PRD → architecture → stories) and <strong className="text-ink">Superpowers for phase 4</strong> (each story becomes a spec → plan → TDD → review cycle).
              </p>
            </div>
            <div className="card p-5 reveal" style={{ borderLeft: "3px solid var(--rust)" }}>
              <div className="chip chip-rust mb-3">But watch out</div>
              <p className="text-[13px] text-ink-2 leading-relaxed">
                Both want to own the implementation loop, and Superpowers' bootstrap is deliberately aggressive — it will try to route <code className="ic">bmad-dev-story</code> through brainstorming. Pick one owner for phase 4 and say so explicitly in your <code className="ic">CLAUDE.md</code>. User instructions beat skills; that is the documented escape hatch.
              </p>
            </div>
          </div>
        </div>

        {/* Chooser */}
        <div className="reveal card p-6 md:p-8">
          <div className="mono text-[10px] uppercase tracking-[0.14em] text-ink-3 mb-4">Four questions</div>
          <div className="space-y-6">
            {Q.map(q => (
              <div key={q.id}>
                <div className="text-sm font-medium text-ink mb-3">{q.q}</div>
                <div className="flex flex-col sm:flex-row gap-2">
                  {q.a.map(a => (
                    <button key={a.t}
                      onClick={() => setAnswers({ ...answers, [q.id]: a.w })}
                      className={`tab flex-1 text-left ${answers[q.id] === a.w ? "active" : ""}`}>
                      {a.t}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {done && (
            <div className="mt-7 pt-6 border-t border-line anim-enter">
              <div className="mono text-[10px] uppercase tracking-[0.14em] text-ink-3 mb-2">Starting recommendation</div>
              {verdict === "b" && (
                <>
                  <div className="display-tight text-2xl text-amber mb-2">Start with BMAD Method.</div>
                  <p className="text-sm text-ink-2 leading-relaxed" style={{ maxWidth: "62ch" }}>
                    Your bottleneck is upstream of the code. Run one real feature through Phases 1–3 with a small group, and treat the PRD and architecture docs as the deliverable. Add Superpowers later if the code quality complaints outlive the planning ones.
                  </p>
                </>
              )}
              {verdict === "s" && (
                <>
                  <div className="display-tight text-2xl text-sage mb-2">Start with Superpowers.</div>
                  <p className="text-sm text-ink-2 leading-relaxed" style={{ maxWidth: "62ch" }}>
                    You already know what to build. Install it, restart, and ship one real feature without changing how you talk. The behaviour change is visible in the first ten minutes, which makes it far easier to sell internally.
                  </p>
                </>
              )}
              {verdict === "both" && (
                <>
                  <div className="display-tight text-2xl text-ink mb-2">Superpowers first, BMAD second.</div>
                  <p className="text-sm text-ink-2 leading-relaxed" style={{ maxWidth: "62ch" }}>
                    You have pain at both ends. Superpowers costs one command and zero process change, so it buys you credibility cheaply. Layer BMAD's planning phases on top once the team trusts the tooling — and give phase 4 to exactly one of them.
                  </p>
                </>
              )}
              <button className="tab mt-5" onClick={() => setAnswers({})}>Reset</button>
            </div>
          )}
        </div>
      </div>
    </Section>
  );
};
